# Render Blueprint — API, worker, Postgres and Key Value (Redis) for PAISLEY art.
# The *.hearthandpan.com hostnames below are placeholders: replace them with the real domain.
# Apply via Render Dashboard -> New -> Blueprint. Plan names change occasionally; check the
# current catalog before applying. Secrets are NOT in this file: they live in the env group
# `hp-api-secrets` (created by this blueprint with sync: false values you fill in the dashboard).
# Staging: apply the same blueprint in a separate Render project/environment with test-mode keys.

envVarGroups:
  - name: hp-api-secrets
    envVars:
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: REFRESH_TOKEN_PEPPER
        sync: false
      - key: ORDER_LOOKUP_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: AMWAL_MERCHANT_ID
        sync: false
      - key: AMWAL_TERMINAL_ID
        sync: false
      - key: AMWAL_SECURE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Resend over SMTP: smtps://resend:<RESEND_API_KEY>@smtp.resend.com:465
      - key: SMTP_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Shared with the storefront (same value) so SSR calls are rate-limited per shopper (D-04).
      - key: INTERNAL_API_TOKEN
        sync: false
  - name: hp-api-config
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "2" # Cloudflare (proxied) -> Render
      - key: WEB_ORIGIN
        value: https://www.hearthandpan.com
      - key: ADMIN_ORIGIN
        value: https://admin.hearthandpan.com
      - key: RATE_LIMIT_STORE
        value: redis
      - key: LOG_LEVEL
        value: info
      - key: RESERVATION_TTL_MINUTES
        value: "15"
      - key: PAYMENT_PROVIDER
        value: amwal
      - key: AMWAL_ENV
        value: uat # switch to production once Amwal approves the live merchant
      - key: IMAGE_STORAGE
        value: r2
      - key: R2_BUCKET
        value: hp-product-images
      - key: REPORT_STORAGE
        value: r2
      - key: R2_REPORTS_BUCKET
        value: hp-reports # private bucket; add a 7-day lifecycle rule on reports/
      - key: API_PUBLIC_URL
        value: https://api.hearthandpan.com
      - key: CDN_BASE_URL
        value: https://cdn.hearthandpan.com
      - key: MAIL_FROM
        value: "PAISLEY art <orders@hearthandpan.com>"
      - key: NODE_VERSION
        value: "22"

services:
  - type: web
    name: hp-api
    runtime: node
    region: oregon
    plan: free # demo size: sleeps when idle; use starter or higher for a real shop
    # Build only the API and its workspace dependencies; `build` depends on `generate` (Prisma client).
    # --prod=false: NODE_ENV=production would otherwise skip the build tooling (turbo, tsup, prisma CLI).
    # Start commands call node directly so pnpm is not needed at runtime.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo build --filter=@hp/api...
    # Free instances have no preDeployCommand, so migrations run at start. Additive (expand -> migrate
    # -> contract) migrations only, so a rollback still runs on the new schema. On a paid plan move
    # `prisma migrate deploy` back into preDeployCommand.
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/server.js
    # Liveness + readiness today (checks DB and Redis). Switch to /api/v1/health/live once the
    # backend adds a dependency-free liveness route (see docs/runbooks/monitoring.md).
    healthCheckPath: /api/v1/health
    autoDeploy: false # deploys are triggered after CI passes (deploy hook)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hp-redis
          property: connectionString
      - fromGroup: hp-api-config
      - fromGroup: hp-api-secrets

  # hp-worker (email delivery, reservation release, guest-cart purge) is left out: Render has no free
  # worker plan. Add a `type: worker` service running `cd apps/api && node dist/worker.js` (same build
  # command and env groups as hp-api) before taking real orders.

  - type: keyvalue
    name: hp-redis
    region: oregon
    plan: free
    # BullMQ requires noeviction: evicted job keys silently lose emails and scheduled jobs.
    maxmemoryPolicy: noeviction
    ipAllowList: [] # private network only

databases:
  - name: hp-db
    databaseName: hearthandpan
    user: hp
    region: oregon
    plan: free # demo only: Render deletes free databases after 30 days; upgrade before real traffic
    postgresMajorVersion: "16"
    ipAllowList: [] # private network only
